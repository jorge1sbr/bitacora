<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- ===== Pantalla: Proyectos ===== -->
    <main class="screen" id="screen-proyectos">
      <header class="screen-header">
        <div>
          <h1>Tus proyectos</h1>
          <p class="subtitle" id="pendientes-hoy">3 pendientes hoy</p>
        </div>
        <div class="header-actions">
          <button id="add-project-btn" class="badge badge-add">+ Proyecto</button>
          <span class="badge badge-level">Niv.4</span>
        </div>
      </header>

      <div class="streak-pill">
        <span class="streak-number">7</span> días de racha de constancia
      </div>

      <!-- El contenido de esta lista se genera dinámicamente desde JS (mostrarProyectos) -->
      <section class="project-list" id="project-list"></section>
    </main>

    <!-- ===== Pantalla: Agenda ===== -->
    <main class="screen" id="screen-agenda" hidden>
      <header class="screen-header">
        <div>
          <h1>Hoy, 5 de agosto</h1>
          <p class="subtitle">4 eventos</p>
        </div>
        <button id="add-event-btn" class="badge badge-add">+ Evento</button>
      </header>

      <section class="agenda-list" id="agenda-list"></section>
    </main>

    <!-- ===== Pantalla: Perfil ===== -->
    <main class="screen" id="screen-perfil" hidden>
      <header class="screen-header">
        <div>
          <h1>Bitácora</h1>
          <p class="subtitle">Desde agosto 2026</p>
        </div>
      </header>

      <section class="stats-grid" id="profile-stats">
        <div class="stat-card">
          <span class="stat-value">5</span>
          <span class="stat-label">Tareas totales</span>
        </div>
        <div class="stat-card">
          <span class="stat-value">3</span>
          <span class="stat-label">Proyectos activos</span>
        </div>
        <div class="stat-card">
          <span class="stat-value">4</span>
          <span class="stat-label">Tareas completadas</span>
        </div>
      </section>
    </main>

    <!-- ===== Navegación inferior ===== -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="proyectos">
        <span class="nav-icon">☰</span>
        <span>Proyectos</span>
      </button>
      <button class="nav-item" data-screen="agenda">
        <span class="nav-icon">📅</span>
        <span>Agenda</span>
      </button>
      <button class="nav-item" data-screen="perfil">
        <span class="nav-icon">👤</span>
        <span>Perfil</span>
      </button>
    </nav>

  </div>

  <!-- ===== Crear/editar evento ===== -->
  <div id="event-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="event-modal-title">Nuevo evento</h2>

      <label class="modal-field">
        Título
        <input type="text" id="event-titulo" placeholder="ej. Estudiar Python">
      </label>

      <label class="modal-field-checkbox">
        <input type="checkbox" id="event-sin-hora">
        Sin hora fija
      </label>

      <label class="modal-field" id="event-hora-field">
        Hora
        <input type="time" id="event-hora">
      </label>

      <label class="modal-field" id="event-duracion-field">
        Duración
        <input type="text" id="event-duracion" placeholder="ej. 30 min">
      </label>

      <div class="modal-field">
        <span>Color</span>
        <div class="color-bordes-evento" id="event-color-swatches">
          <button type="button" class="color-borde-evento color-borde-evento-vacio selected" data-color="" title="Sin color"></button>
          <button type="button" class="color-borde-evento" data-color="#4ade80" style="background:#4ade80"></button>
          <button type="button" class="color-borde-evento" data-color="#38bdf8" style="background:#38bdf8"></button>
          <button type="button" class="color-borde-evento" data-color="#f5a623" style="background:#f5a623"></button>
          <button type="button" class="color-borde-evento" data-color="#f472b6" style="background:#f472b6"></button>
          <button type="button" class="color-borde-evento" data-color="#a78bfa" style="background:#a78bfa"></button>
        </div>
      </div>

      <label class="modal-field-checkbox">
        <input type="checkbox" id="event-tiene-alarma">
        Poner alarma
      </label>

      <label class="modal-field" id="event-alarma-field" hidden>
        Hora de la alarma
        <input type="time" id="event-alarma">
      </label>

      <div class="modal-actions">
        <button id="event-modal-cancel" class="modal-btn-secondary">Cancelar</button>
        <button id="event-modal-save" class="modal-btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
