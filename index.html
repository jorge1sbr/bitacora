<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- ===== Pantalla: Proyectos ===== -->
    <main class="screen" id="screen-proyectos">
      <header class="screen-header">
        <div>
          <h1>Tus proyectos</h1>
          <p class="subtitle" id="proyectos-pendientes"></p>
        </div>
        <div class="header-actions">
          <button id="add-project-btn" class="badge badge-add">+ Proyecto</button>
        </div>
      </header>

      <!-- El contenido de esta lista se genera dinámicamente desde JS (showProyectos) -->
      <section class="project-list" id="project-list"></section>
    </main>

    <!-- ===== Pantalla: Agenda ===== -->
    <main class="screen" id="screen-agenda" hidden>
      <header class="screen-header">
        <div>
          <h1 id="agenda-fecha">Hoy</h1>
          <p class="subtitle" id="agenda-contador"></p>
        </div>
        <button id="add-event-btn" class="badge badge-add">+ Evento</button>
      </header>

      <!-- Aviso discreto si las alarmas no pueden sonar (permiso no dado, bloqueado o sin soporte) -->
      <div class="aviso-alarmas" id="aviso-alarmas" hidden>
        <span id="aviso-alarmas-texto"></span>
        <button class="aviso-alarmas-btn" id="aviso-alarmas-btn" hidden>Activar avisos</button>
      </div>

      <section class="agenda-list" id="agenda-list"></section>
    </main>

    <!-- ===== Pantalla: Perfil ===== -->
    <main class="screen" id="screen-perfil" hidden>
      <header class="screen-header">
        <div>
          <h1>Bitácora</h1>
          <p class="subtitle" id="perfil-desde"></p>
        </div>
      </header>

      <div class="profile-highlight">
        <p class="profile-highlight-sub" id="profile-completadas-hoy"></p>
        <p class="profile-highlight-percent" id="profile-percent">0%</p>
      </div>

      <section class="stats-grid" id="profile-stats"></section>

      <p class="profile-section-label">Progreso por proyecto</p>
      <div id="profile-project-progress"></div>
    </main>

    <!-- ===== Navegación inferior ===== -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="proyectos">
        <span class="nav-icon">☰</span>
        <span>Proyectos</span>
      </button>
      <button class="nav-item" data-screen="agenda">
        <span class="nav-icon">📅</span>
        <span>Agenda</span>
      </button>
      <button class="nav-item" data-screen="perfil">
        <span class="nav-icon">👤</span>
        <span>Perfil</span>
      </button>
    </nav>

  </div>

  <!-- ===== Crear/editar evento ===== -->
  <div id="event-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="event-modal-title">Nuevo evento</h2>

      <label class="modal-field">
        Título
        <input type="text" id="event-titulo" placeholder="ej. Estudiar Python">
      </label>

      <label class="modal-field-checkbox">
        <input type="checkbox" id="event-sin-hora">
        Sin hora fija
      </label>

      <label class="modal-field" id="event-hora-field">
        Hora
        <input type="time" id="event-hora">
      </label>

      <label class="modal-field" id="event-duracion-field">
        Duración
        <input type="text" id="event-duracion" placeholder="ej. 30 min">
      </label>

      <div class="modal-field">
        <span>Color</span>
        <div class="color-bordes-evento" id="event-color-swatches">
          <button type="button" class="color-borde-evento color-borde-evento-vacio selected" data-color="" title="Sin color"></button>
          <button type="button" class="color-borde-evento" data-color="#4ade80" style="background:#4ade80"></button>
          <button type="button" class="color-borde-evento" data-color="#38bdf8" style="background:#38bdf8"></button>
          <button type="button" class="color-borde-evento" data-color="#f5a623" style="background:#f5a623"></button>
          <button type="button" class="color-borde-evento" data-color="#f472b6" style="background:#f472b6"></button>
          <button type="button" class="color-borde-evento" data-color="#a78bfa" style="background:#a78bfa"></button>
        </div>
      </div>

      <label class="modal-field-checkbox">
        <input type="checkbox" id="event-tiene-alarma">
        Poner alarma
      </label>

      <label class="modal-field" id="event-alarma-field" hidden>
        Hora de la alarma
        <input type="time" id="event-alarma">
        <span class="modal-nota">Solo suena con Bitácora abierta en una pestaña del navegador.</span>
        <span class="modal-aviso" id="event-alarma-aviso" hidden></span>
      </label>

      <p class="modal-error" id="event-modal-error" hidden></p>

      <div class="modal-actions">
        <button id="event-modal-cancel" class="modal-btn-secondary">Cancelar</button>
        <button id="event-modal-save" class="modal-btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- ===== Diálogo genérico (askTexto / confirmAccion) ===== -->
  <div id="dialog-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dialog-titulo">
      <h2 id="dialog-titulo"></h2>
      <p class="dialog-mensaje" id="dialog-mensaje" hidden></p>
      <label class="modal-field" id="dialog-campo" hidden>
        <input type="text" id="dialog-input">
      </label>
      <p class="modal-error" id="dialog-error" hidden></p>
      <div class="modal-actions">
        <button id="dialog-cancel" class="modal-btn-secondary">Cancelar</button>
        <button id="dialog-ok" class="modal-btn-primary">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
